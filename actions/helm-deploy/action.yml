name: Helm Deploy 2060
description: Detects changed charts and deploys using Helm with optional environment overrides
inputs:
  directory:
    required: true
    description: Path to the base directory (e.g. charts)
  manifest:
    required: false
    default: "clusters.yml"
    description: yaml manifest file defining clusters and their patterns (by default clusters.yml)
  release:
    required: false
    description: Optional release name to deploy directly
  uninstall:
    required: false
    type: boolean
    description: Optional release name to uninstall directly
  dryRun:
    required: false
    description: If true, performs a dry-run of the deployment
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Validate required inputs
      shell: bash
      run: |
        if [ ! -d "${{ inputs.directory }}" ]; then
          echo "Directory ${{ inputs.directory }} does not exist"
          exit 1
        fi

        if [ ! -f "${{ inputs.manifest }}" ]; then
          echo "::error::Manifest file '${{ inputs.manifest }}' not found"
          exit 1
        fi

    - name: Install yq
      uses: Makepad-fr/setup-yq-action@main
      with:
        version: '4.6.0'

    - name: Detect changed value files
      id: changed_files
      shell: bash
      run: |
        git fetch origin main

        if [[ "${{ inputs.release }}" != "" ]]; then
          FILES="${{ inputs.directory }}/${{ inputs.release }}.yaml"
        else
          FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
          | grep -E "^${{ inputs.directory }}/.*\.(yml|yaml)$" || true)
        fi

        if [ -z "$FILES" ]; then
          echo "No environment changes detected"
          exit 0
        fi

        echo "changed<<EOF" >> $GITHUB_OUTPUT
        echo "$FILES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Extract chart info per changed env
      id: chart_info
      if: ${{ inputs.uninstall != 'true' }}
      shell: bash
      run: |
        DRY_RUN_FLAG=$(./scripts/dry-run-flag.sh "${{ inputs.dryRun }}")

        CHANGED_FILES="${{ steps.changed_files.outputs.changed }}"
        MANIFEST="$GITHUB_WORKSPACE/${{ inputs.manifest }}"
        CLUSTER_COUNT=$(yq e '.clusters | length' $MANIFEST)

        for i in $(seq 0 $((CLUSTER_COUNT - 1))); do
          CLUSTER_NAME=$(yq e ".clusters[$i].name" $MANIFEST)
          PATTERN=$(yq e ".clusters[$i].pattern" $MANIFEST)

          echo "=============================="
          echo "Processing cluster: $CLUSTER_NAME"
          echo "Pattern: $PATTERN"

          MATCHED_FILES=$(echo "$CHANGED_FILES" | grep "$PATTERN" || true)
          if [ -z "$MATCHED_FILES" ]; then
            echo "No changes for cluster $CLUSTER_NAME"
            continue
          fi

          ./scripts/setup-kubeconfig.sh "$MANIFEST" "$CLUSTER_NAME"
          echo "Using kubeconfig for cluster: $CLUSTER_NAME"

          while read -r file; do
            [ -z "$file" ] && continue

            RELEASE=$(basename "$file" .yaml)
            echo "Deploying $RELEASE in cluster $CLUSTER_NAME using $file"

            CHART_SOURCE=$(yq e '.chartSource // ""' "$file")
            CHART_VERSION=$(yq e '.chartVersion // ""' "$file")
            CHART_NAMESPACE=$(yq e '.chartNamespace // ""' "$file")
            ./scripts/validate-env-vars.sh CHART_SOURCE CHART_VERSION CHART_NAMESPACE

            # Search chartSecrets on yaml file and replace it with --set
            SECRET_ARGS=""
            SECRET_COUNT=$(yq e '.chartSecrets // [] | length' "$file")
            if [[ "$SECRET_COUNT" -gt 0 ]]; then
              echo "Processing $SECRET_COUNT secrets from $file"
              for i in $(seq 0 $((SECRET_COUNT - 1))); do
                SECRET_NAME=$(yq e ".chartSecrets[$i].name" "$file")
                SECRET_PATH=$(yq e ".chartSecrets[$i].path" "$file")

                if [[ -z "$SECRET_NAME" || -z "$SECRET_PATH" ]]; then
                  echo "Invalid secret entry in $file (index $i)"
                  exit 1
                fi

                echo "Mapping secret $SECRET_NAME to path $SECRET_PATH"
                SECRET_VALUE=$(printenv "$SECRET_NAME")
                if [[ -z "$SECRET_VALUE" ]]; then
                  echo "Secret $SECRET_NAME not found in environment variables"
                  exit 1
                fi

                SECRET_ARGS="$SECRET_ARGS --set $SECRET_PATH=$SECRET_VALUE"
              done
            fi

            helm upgrade --install "$RELEASE" "$CHART_SOURCE" \
              --version "$CHART_VERSION" \
              -f "$file" \
              --namespace "$CHART_NAMESPACE" \
              --create-namespace \
              $DRY_RUN_FLAG

          done <<< "$MATCHED_FILES"
        done

    - name: Uninstall release
      if: ${{ inputs.uninstall == 'true' && inputs.release != '' }}
      shell: bash
      run: |
        DRY_RUN_FLAG=$(./scripts/dry-run-flag.sh "${{ inputs.dryRun }}")

        MANIFEST="$GITHUB_WORKSPACE/${{ inputs.manifest }}"
        CLUSTER_NAME="$(dirname "${{ inputs.release }}" | xargs basename)"
        RELEASE_NAME="$(basename "${{ inputs.release }}" .yaml)"

        echo "=============================="
        echo "Processing cluster: $CLUSTER_NAME"
        echo "Pattern: $PATTERN"

        ./scripts/setup-kubeconfig.sh "$MANIFEST" "$CLUSTER_NAME"

        CHART_NAMESPACE=$(yq e '.chartNamespace // ""' "$FILE")
        ./scripts/validate-env-vars.sh CHART_NAMESPACE

        echo "Uninstalling release '$RELEASE_NAME' from cluster '$CLUSTER_NAME'"
        helm uninstall "$RELEASE_NAME" \
          --namespace "$CHART_NAMESPACE" \
          $DRY_RUN_FLAG || echo "Release not found or already removed"
