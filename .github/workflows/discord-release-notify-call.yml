name: Discord Release Notify

on:
  workflow_call:
    inputs:
      tag_name:
        description: "Release tag to announce (e.g. v1.2.3)."
        required: true
        type: string
    secrets:
      DISCORD_UPDATES_WEBHOOK_URL:
        description: "Discord channel webhook URL where release notifications are posted. If unset, the workflow exits without posting."
        required: false

permissions:
  contents: read

jobs:
  notify:
    name: Post release to Discord
    runs-on: ubuntu-latest
    steps:
      - name: Post release embed
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.DISCORD_UPDATES_WEBHOOK_URL }}
          REPO_FULL_NAME: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          if [ -z "${WEBHOOK_URL}" ]; then
            echo "::warning::DISCORD_UPDATES_WEBHOOK_URL is not set, skipping Discord notification."
            exit 0
          fi

          REPO_NAME="${REPO_FULL_NAME##*/}"
          TAG_ENC=$(jq -rn --arg t "$TAG" '$t|@uri')
          release=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_ENC}")
          BODY=$(jq -r '.body // ""' <<< "$release")
          URL=$(jq -r '.html_url' <<< "$release")
          PRERELEASE=$(jq -r '.prerelease' <<< "$release")
          PUBLISHED_AT=$(jq -r '.published_at' <<< "$release")

          if [ -z "${BODY}" ] || [ "${BODY}" = "null" ]; then
            BODY="(No release notes provided.)"
          fi

          if [ "${PRERELEASE}" = "true" ]; then
            COLOR=$((0xf39c12))
            LABEL="prerelease"
          else
            COLOR=$((0x2ecc71))
            LABEL="stable"
          fi

          TITLE="${REPO_NAME} ${TAG}"
          FOOTER="${REPO_FULL_NAME} (${LABEL})"

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$BODY" \
            --arg url "$URL" \
            --arg footer "$FOOTER" \
            --arg timestamp "$PUBLISHED_AT" \
            --argjson color "$COLOR" \
            '
            def truncate_body($u):
              if (. | length) > 3800 then
                .[0:3800] + "\n\n[View full release on GitHub](" + $u + ")"
              else
                .
              end;
            {
              embeds: [
                {
                  title: $title,
                  description: ($description | truncate_body($url)),
                  url: $url,
                  color: $color,
                  footer: { text: $footer },
                  timestamp: $timestamp
                }
              ]
            }')

          HTTP_CODE=$(curl -sS -o /tmp/discord_response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data "$PAYLOAD" \
            "$WEBHOOK_URL")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Discord webhook returned HTTP ${HTTP_CODE}"
            cat /tmp/discord_response.txt
            exit 1
          fi

          echo "Posted release notification for ${TITLE} (HTTP ${HTTP_CODE})."
