name: Unstable Image Template

on:
  workflow_call:
    inputs:
      image-tag:
        required: false
        type: string
        default: dev

      dockerfile:
        required: true
        type: string

      enable-helm:
        description: "Enable Helm publish step"
        required: false
        type: boolean
        default: false

      charts:
        description: "Space-separated list of chart directories"
        required: false
        type: string
        default: ""

      dependent-charts:
        description: "Space-separated list of dependent chart directories"
        required: false
        type: string
        default: ""

      dry-run:
        description: "If true, only print commands instead of executing"
        required: false
        type: string
        default: "false"

    secrets:
      DOCKER_HUB_LOGIN:
        required: true
      DOCKER_HUB_PWD:
        required: true

    outputs:
      release-version:
        description: "Release version from semantic-release"
        value: ${{ jobs.build.outputs.release-version }}

env:
  IMAGE_TAG: ${{ inputs.image-tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      release-major: ${{ steps.semantic.outputs.release-major }}
      release-minor: ${{ steps.semantic.outputs.release-minor }}
      release-patch: ${{ steps.semantic.outputs.release-patch }}
      release-version: ${{ steps.semantic.outputs.release-version }}
      dockerfiles: ${{ steps.set-matrix.outputs.dockerfiles }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure release branch exists
        run: |
          if git ls-remote --heads origin release | grep release; then
            echo "Branch 'release' already exists in origin."
          else
            echo "Branch 'release' does not exist. Creating it..."
            git checkout -b release
            git push origin release
          fi

      - name: Set matrix dockerfiles
        id: set-matrix
        run: |
          json="["
          first=true
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path=$(echo "$line" | cut -d= -f1)
            image=$(echo "$line" | cut -d= -f2)
            if [ "$first" = true ]; then
              first=false
            else
              json+=", "
            fi
            json+="{\"path\":\"$path\",\"image\":\"$image\"}"
          done <<EOF
          ${{ inputs.dockerfile }}
          EOF
          json+="]"
          echo "dockerfiles=$json" >> $GITHUB_OUTPUT

      - uses: codfish/semantic-release-action@v3
        id: semantic
        with:
          branches: |
            [
              'release',
              { 
                name: 'main',
                prerelease: 'dev'
              }
            ]
          plugins: |
            [
              [
                "@semantic-release/commit-analyzer",
                {
                  "preset": "angular",
                  "releaseRules": [
                    { "type": "refactor", "release": "patch" },
                    { "type": "build", "release": "patch" }
                  ]
                }
              ],
              [
                "@semantic-release/npm",
                { "npmPublish": false }
              ],
              "@semantic-release/release-notes-generator"
            ]

  docker:
    needs: build
    if: needs.build.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.build.outputs.dockerfiles) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: inputs.dry-run != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Print Docker tags (dry-run)
        if: inputs.dry-run == 'true'
        run: |
          echo "Dry run mode enabled"
          echo "These are the tags that would be pushed for $(basename ${{ matrix.path }}):"
          echo "${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):${{ env.IMAGE_TAG }}"
          echo "${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-major }}-${{ env.IMAGE_TAG }}"
          echo "${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-major }}.${{ needs.build.outputs.release-minor }}-${{ env.IMAGE_TAG }}"
          echo "${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-major }}.${{ needs.build.outputs.release-minor }}.${{ needs.build.outputs.release-patch }}-${{ env.IMAGE_TAG }}"
          echo "${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-version }}"

      - name: Build and push Docker image
        if: inputs.dry-run != 'true'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-major }}-${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-major }}.${{ needs.build.outputs.release-minor }}-${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-major }}.${{ needs.build.outputs.release-minor }}.${{ needs.build.outputs.release-patch }}-${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKER_HUB_LOGIN }}/$(basename ${{ matrix.image }}):v${{ needs.build.outputs.release-version }}

  helm:
    needs: [build, docker]
    if: inputs.enable-helm == true && needs.build.outputs.new-release-published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run publish-helm action
        id: publish-helm
        uses: 2060-io/devops/actions/publish-helm@main
        with:
          dh-username: ${{ secrets.DOCKER_HUB_LOGIN }}
          dh-token: ${{ secrets.DOCKER_HUB_PWD }}
          release-version: v${{ needs.build.outputs.release-version }}
          charts: ${{ inputs.charts }}
          dependent-charts: ${{ inputs.dependent-charts }}
          dry-run: ${{ inputs.dry-run }}
