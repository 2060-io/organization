name: Continuous Integration

on:
  workflow_call:
    inputs:
      charts-dir:
        description: "Directory containing Helm charts"
        required: false
        type: string
      enable-charts-lint:
        description: "Enable Helm charts linting"
        required: false
        type: boolean
        default: true

jobs:
  lint:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js v22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check Format
        run: pnpm check-format

      - name: Check Types
        run: pnpm check-types

      - name: Unit Tests
        run: pnpm test

      - name: Integration Tests
        run: |
          if pnpm run | grep -q "test:integration"; then
            pnpm test:integration
          else
            echo "Skipping integration tests (script not defined)"
          fi

      - name: End to End Tests
        run: |
          if pnpm run | grep -q "test:e2e"; then
            pnpm test:e2e
          else
            echo "Skipping end-to-end tests (script not defined)"
          fi

  charts:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    needs: lint
    if: ${{ inputs.enable-charts-lint == true }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate Helm charts
        run: |
          charts_dir="${{ inputs.charts-dir }}"
          echo "Using charts directory: $charts_dir"

          if [ -n "$charts_dir" ] && [ -d "$charts_dir" ]; then
            helm lint "$charts_dir"
          else
            for chart in ./charts/*; do
              if [ -d "$chart" ] && [ -f "$chart/Chart.yaml" ]; then
                echo "Validating chart: $chart"
                helm lint "$chart"
              fi
            done
          fi

  pr-validation:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint
    steps:
      - uses: amannn/action-semantic-pull-request@cfb60706e18bc85e8aec535e3c577abe8f70378e # v5.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: true
