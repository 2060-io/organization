name: Stable Versioning

on:
  workflow_call:
    inputs:
      bump-minor-pre-major:
        type: boolean
        default: true
        required: false
      config-file:
        type: string
        default: release-please-config.json
        required: false
      manifest-file:
        type: string
        default: .release-please-manifest.json
        required: false
      generate-notes:
        type: boolean
        default: false
        required: false
      create-pre-release:
        type: boolean
        default: false
        required: false
      release-title:
        type: string
        default: ""
        required: false
      prerelease-branch:
        description: "Branch semantic-release treats as the dev prerelease branch"
        type: string
        default: main
        required: false
    outputs:
      release-version:
        description: "Release version from versioning system"
        value: ${{ jobs.versioning.outputs.release-version }}
      
      release-type:
        description: "Type of release created (stable or dev)"
        value: ${{ jobs.versioning.outputs.release-type }}

      new-release-published:
        description: "Indicates if a new release was created"
        value: ${{ jobs.versioning.outputs.new-release-published }}

      release-major:
        value: ${{ jobs.versioning.outputs.release-major }}

      release-minor:
        value: ${{ jobs.versioning.outputs.release-minor }}

      release-patch:
        value: ${{ jobs.versioning.outputs.release-patch }}

permissions:
  contents: write
  pull-requests: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.set-version.outputs.version }}
      release-type: ${{ steps.set-version.outputs.type }}
      new-release-published: ${{ steps.set-version.outputs.published }}
      release-major: ${{ steps.set-version.outputs.major }}
      release-minor: ${{ steps.set-version.outputs.minor }}
      release-patch: ${{ steps.set-version.outputs.patch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Ensure release branch exists
        run: |
          if git ls-remote --heads origin release | grep release; then
            echo "Branch 'release' already exists in origin."
          else
            echo "Branch 'release' does not exist. Creating it..."
            git checkout -b release
            git push origin release
          fi

      - name: Process Release Please (Stable)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare semantic-release config (Dev)
        if: steps.release-please.outputs.release_created != 'true'
        run: |
          cat > .releaserc.json <<'EOF'
          {
            "branches": [
              "release",
              { "name": "${{ inputs.prerelease-branch }}", "prerelease": "dev" }
            ],
            "plugins": [
              [
                "@semantic-release/commit-analyzer",
                {
                  "preset": "angular",
                  "releaseRules": [
                    { "type": "feat", "release": "${{ inputs.bump-minor-pre-major && 'minor' || 'patch' }}" },
                    { "type": "refactor", "release": "patch" },
                    { "type": "build", "release": "patch" }
                  ]
                }
              ],
              "@semantic-release/release-notes-generator"
            ]
          }
          EOF

      - name: Fallback to Semantic Release (Dev)
        if: steps.release-please.outputs.release_created != 'true'
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release (Stable)
        if: steps.release-please.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="${{ inputs.release-title }}"
          VERSION="${{ steps.release-please.outputs.tag_name }}"
          GENERATE="${{ inputs.generate-notes }}"
          ARGS=()
          if [ -n "$TITLE" ]; then
            ARGS+=("--title" "${TITLE} ${VERSION}")
          fi
          if [ "$GENERATE" == "true" ]; then
            NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              --method POST \
              -f tag_name="${VERSION}" \
              --jq '.body')
            ARGS+=("--notes" "$NOTES")
          fi
          if [ ${#ARGS[@]} -gt 0 ]; then
            gh release edit "${VERSION}" "${ARGS[@]}"
          fi

      - name: Create GitHub Pre-release (Dev)
        if: inputs.create-pre-release && steps.semantic-release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="${{ inputs.release-title }}"
          VERSION="v${{ steps.semantic-release.outputs.new_release_version }}"
          GENERATE="${{ inputs.generate-notes }}"
          ARGS=("--prerelease")
          if [ -n "$TITLE" ]; then
            ARGS+=("--title" "${TITLE} ${VERSION}")
          fi
          if [ "$GENERATE" == "true" ]; then
            ARGS+=("--generate-notes")
          fi
          gh release create "${VERSION}" "${ARGS[@]}"

      - name: Set final version outputs
        id: set-version
        run: |
          if [ "${{ steps.release-please.outputs.releases_created }}" == "true" ]; then
            echo "version=${{ steps.release-please.outputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "type=stable" >> $GITHUB_OUTPUT
            echo "published=true" >> $GITHUB_OUTPUT
            echo "major=${{ steps.release-please.outputs.major }}" >> $GITHUB_OUTPUT
            echo "minor=${{ steps.release-please.outputs.minor }}" >> $GITHUB_OUTPUT
            echo "patch=${{ steps.release-please.outputs.patch }}" >> $GITHUB_OUTPUT
            echo "Stable release created: ${{ steps.release-please.outputs.tag_name }}"
          elif [ "${{ steps.semantic-release.outputs.new_release_published }}" == "true" ]; then
            echo "version=v${{ steps.semantic-release.outputs.new_release_version }}" >> $GITHUB_OUTPUT
            echo "type=dev" >> $GITHUB_OUTPUT
            echo "published=true" >> $GITHUB_OUTPUT
            echo "major=${{ steps.semantic-release.outputs.new_release_major_version }}" >> $GITHUB_OUTPUT
            echo "minor=${{ steps.semantic-release.outputs.new_release_minor_version }}" >> $GITHUB_OUTPUT
            echo "patch=${{ steps.semantic-release.outputs.new_release_patch_version }}" >> $GITHUB_OUTPUT
            echo "Dev release created: ${{ steps.semantic-release.outputs.new_release_version }}"
          else
            echo "type=none" >> $GITHUB_OUTPUT
            echo "published=false" >> $GITHUB_OUTPUT
            echo "No release created"
          fi
