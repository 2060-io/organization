name: Stable Versioning

on:
  workflow_call:
    inputs:
      bump-minor-pre-major:
        description: "Deprecated: use `feat-release-type`. Only consulted when the Release Please config cannot be read."
        type: boolean
        default: true
        required: false
      config-file:
        type: string
        default: release-please-config.json
        required: false
      manifest-file:
        type: string
        default: .release-please-manifest.json
        required: false
      generate-notes:
        type: boolean
        default: false
        required: false
      create-pre-release:
        type: boolean
        default: false
        required: false
      release-title:
        type: string
        default: ""
        required: false
      prerelease-branch:
        description: "Branch semantic-release treats as the dev prerelease branch"
        type: string
        default: main
        required: false
      breaking-release-type:
        description: "Bump applied to breaking changes in dev prereleases: major, minor, patch, or auto (derive from the Release Please config)"
        type: string
        default: auto
        required: false
      feat-release-type:
        description: "Bump applied to feat commits in dev prereleases: major, minor, patch, or auto (derive from the Release Please config)"
        type: string
        default: auto
        required: false
    outputs:
      release-version:
        description: "Release version from versioning system"
        value: ${{ jobs.versioning.outputs.release-version }}
      
      release-type:
        description: "Type of release created (stable or dev)"
        value: ${{ jobs.versioning.outputs.release-type }}

      new-release-published:
        description: "Indicates if a new release was created"
        value: ${{ jobs.versioning.outputs.new-release-published }}

      release-major:
        value: ${{ jobs.versioning.outputs.release-major }}

      release-minor:
        value: ${{ jobs.versioning.outputs.release-minor }}

      release-patch:
        value: ${{ jobs.versioning.outputs.release-patch }}

permissions:
  contents: write
  pull-requests: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.set-version.outputs.version }}
      release-type: ${{ steps.set-version.outputs.type }}
      new-release-published: ${{ steps.set-version.outputs.published }}
      release-major: ${{ steps.set-version.outputs.major }}
      release-minor: ${{ steps.set-version.outputs.minor }}
      release-patch: ${{ steps.set-version.outputs.patch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Ensure release branch exists
        run: |
          if git ls-remote --heads origin release | grep release; then
            echo "Branch 'release' already exists in origin."
          else
            echo "Branch 'release' does not exist. Creating it..."
            git checkout -b release
            git push origin release
          fi

      - name: Process Release Please (Stable)
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}

      - name: Resolve dev release rules (Dev)
        if: steps.release-please.outputs.release_created != 'true'
        id: release-rules
        env:
          BREAKING_RELEASE_TYPE: ${{ inputs.breaking-release-type }}
          FEAT_RELEASE_TYPE: ${{ inputs.feat-release-type }}
          BUMP_MINOR_PRE_MAJOR: ${{ inputs.bump-minor-pre-major }}
          CONFIG_FILE: ${{ inputs.config-file }}
          MANIFEST_FILE: ${{ inputs.manifest-file }}
        run: |
          set -euo pipefail

          # Release Please owns the version policy, so the dev channel derives its
          # rules from the same config instead of keeping a second source of truth.
          # Two separate keys govern pre-1.0.0 behaviour:
          #   bump-minor-pre-major           -> breaking changes bump minor, not major
          #   bump-patch-for-minor-pre-major -> feat changes bump patch, not minor
          # Semantic Release has no pre-1.0 special case of its own, so without this
          # a breaking change on 0.3.2 would resolve to 1.0.0-dev while Release
          # Please proposes 0.4.0 for the same commits.
          VERSION=$(jq -r '(([.["."]] + [to_entries[].value] | map(select(type == "string")) | first)) // empty' "$MANIFEST_FILE" 2>/dev/null || true)

          config_flag() {
            jq -r --arg key "$1" '.[$key] // false' "$CONFIG_FILE" 2>/dev/null || echo false
          }

          if [ -z "$VERSION" ]; then
            # Degrade rather than fail the release: plain semver for breaking
            # changes, and the deprecated input for feat commits.
            BREAKING=major
            if [ "$BUMP_MINOR_PRE_MAJOR" = "true" ]; then FEAT=minor; else FEAT=patch; fi
            echo "No version found in '$MANIFEST_FILE'; using bump-minor-pre-major=$BUMP_MINOR_PRE_MAJOR for feat"
          elif [ "${VERSION%%.*}" != "0" ]; then
            BREAKING=major
            FEAT=minor
            echo "Current version $VERSION"
          else
            if [ "$(config_flag bump-minor-pre-major)" = "true" ]; then BREAKING=minor; else BREAKING=patch; fi
            if [ "$(config_flag bump-patch-for-minor-pre-major)" = "true" ]; then FEAT=patch; else FEAT=minor; fi
            echo "Current version $VERSION (pre-1.0.0)"
          fi

          if [ "$BREAKING_RELEASE_TYPE" != "auto" ]; then
            BREAKING="$BREAKING_RELEASE_TYPE"
            echo "breaking-release-type set explicitly"
          fi
          if [ "$FEAT_RELEASE_TYPE" != "auto" ]; then
            FEAT="$FEAT_RELEASE_TYPE"
            echo "feat-release-type set explicitly"
          fi

          echo "Dev bumps -> breaking changes: $BREAKING, feat: $FEAT"
          echo "breaking=$BREAKING" >> "$GITHUB_OUTPUT"
          echo "feat=$FEAT" >> "$GITHUB_OUTPUT"

      - name: Prepare semantic-release config (Dev)
        if: steps.release-please.outputs.release_created != 'true'
        run: |
          cat > .releaserc.json <<'EOF'
          {
            "branches": [
              "release",
              { "name": "${{ inputs.prerelease-branch }}", "prerelease": "dev" }
            ],
            "plugins": [
              [
                "@semantic-release/commit-analyzer",
                {
                  "preset": "angular",
                  "parserOpts": {
                    "headerPattern": "^(\\w*)(?:\\(([^)]*)\\))?!?: (.*)$",
                    "breakingHeaderPattern": "^(\\w*)(?:\\(([^)]*)\\))?!: (.*)$"
                  },
                  "releaseRules": [
                    { "breaking": true, "release": "${{ steps.release-rules.outputs.breaking }}" },
                    { "type": "feat", "release": "${{ steps.release-rules.outputs.feat }}" },
                    { "type": "refactor", "release": "patch" },
                    { "type": "build", "release": "patch" }
                  ]
                }
              ],
              "@semantic-release/release-notes-generator"
            ]
          }
          EOF

      - name: Fallback to Semantic Release (Dev)
        if: steps.release-please.outputs.release_created != 'true'
        id: semantic-release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Release (Stable)
        if: steps.release-please.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="${{ inputs.release-title }}"
          VERSION="${{ steps.release-please.outputs.tag_name }}"
          GENERATE="${{ inputs.generate-notes }}"
          ARGS=()
          if [ -n "$TITLE" ]; then
            ARGS+=("--title" "${TITLE} ${VERSION}")
          fi
          if [ "$GENERATE" == "true" ]; then
            NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              --method POST \
              -f tag_name="${VERSION}" \
              --jq '.body')
            ARGS+=("--notes" "$NOTES")
          fi
          if [ ${#ARGS[@]} -gt 0 ]; then
            gh release edit "${VERSION}" "${ARGS[@]}"
          fi

      - name: Create GitHub Pre-release (Dev)
        if: inputs.create-pre-release && steps.semantic-release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="${{ inputs.release-title }}"
          VERSION="v${{ steps.semantic-release.outputs.new_release_version }}"
          GENERATE="${{ inputs.generate-notes }}"
          ARGS=("--prerelease")
          if [ -n "$TITLE" ]; then
            ARGS+=("--title" "${TITLE} ${VERSION}")
          fi
          if [ "$GENERATE" == "true" ]; then
            ARGS+=("--generate-notes")
          fi
          gh release create "${VERSION}" "${ARGS[@]}"

      - name: Set final version outputs
        id: set-version
        run: |
          if [ "${{ steps.release-please.outputs.releases_created }}" == "true" ]; then
            echo "version=${{ steps.release-please.outputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "type=stable" >> $GITHUB_OUTPUT
            echo "published=true" >> $GITHUB_OUTPUT
            echo "major=${{ steps.release-please.outputs.major }}" >> $GITHUB_OUTPUT
            echo "minor=${{ steps.release-please.outputs.minor }}" >> $GITHUB_OUTPUT
            echo "patch=${{ steps.release-please.outputs.patch }}" >> $GITHUB_OUTPUT
            echo "Stable release created: ${{ steps.release-please.outputs.tag_name }}"
          elif [ "${{ steps.semantic-release.outputs.new_release_published }}" == "true" ]; then
            echo "version=v${{ steps.semantic-release.outputs.new_release_version }}" >> $GITHUB_OUTPUT
            echo "type=dev" >> $GITHUB_OUTPUT
            echo "published=true" >> $GITHUB_OUTPUT
            echo "major=${{ steps.semantic-release.outputs.new_release_major_version }}" >> $GITHUB_OUTPUT
            echo "minor=${{ steps.semantic-release.outputs.new_release_minor_version }}" >> $GITHUB_OUTPUT
            echo "patch=${{ steps.semantic-release.outputs.new_release_patch_version }}" >> $GITHUB_OUTPUT
            echo "Dev release created: ${{ steps.semantic-release.outputs.new_release_version }}"
          else
            echo "type=none" >> $GITHUB_OUTPUT
            echo "published=false" >> $GITHUB_OUTPUT
            echo "No release created"
          fi
